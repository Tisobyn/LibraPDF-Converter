<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke" /></marker>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker>
<marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b45"/></marker></defs>
<rect width="794" height="1123" fill="#fff"/>
<text x="397" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a">Request sequence</text>
<text x="397" y="74" text-anchor="middle" font-size="14" font-weight="normal" fill="#555">What happens, in order</text>
<rect x="40" y="100" width="140" height="46" rx="10" fill="#eef2f7" stroke="#5b6b82" stroke-width="1.5"/>
<text x="110.0" y="114.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">iOS / Android</text>
<text x="110.0" y="131.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#444">app</text>
<line x1="110" y1="146" x2="110" y2="580" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="222" y="100" width="140" height="46" rx="10" fill="#fff7e6" stroke="#c98a1b" stroke-width="1.5"/>
<text x="292.0" y="114.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Our server</text>
<text x="292.0" y="131.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#444">Node + Express</text>
<line x1="292" y1="146" x2="292" y2="580" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="586" y="100" width="140" height="46" rx="10" fill="#e9f7ec" stroke="#2e8b45" stroke-width="1.5"/>
<text x="656.0" y="114.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">LibreOffice</text>
<text x="656.0" y="131.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#444">on our server</text>
<line x1="656" y1="146" x2="656" y2="580" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="110" y1="190" x2="292" y2="190" stroke="#444" stroke-width="1.5" marker-end="url(#a1)"/>
<text x="201.0" y="184" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#333">POST /convert (file)</text>
<rect x="212" y="208" width="160" height="32" rx="6" fill="#fff7e6" stroke="#c98a1b"/><text x="292" y="222" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#444">key, free slot, rate limit,</text>
<text x="292" y="235" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#444">size, type, content</text>
<rect x="60" y="262" width="674" height="136" rx="8" fill="#e9f7ec" stroke="#2e8b45" stroke-dasharray="6 4"/><text x="72" y="280" text-anchor="start" font-size="12" font-weight="bold" fill="#2e8b45">Convert with LibreOffice on our server</text>
<line x1="292" y1="320" x2="656" y2="320" stroke="#444" stroke-width="1.5" marker-end="url(#a1)"/>
<text x="474.0" y="314" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#333">convert locally (max 60 s)</text>
<line x1="656" y1="370" x2="292" y2="370" stroke="#444" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a1)"/>
<text x="474.0" y="364" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#333">PDF</text>
<rect x="212" y="420" width="160" height="32" rx="6" fill="#f3eefb" stroke="#7a4fc0"/><text x="292" y="434" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#444">delete temp files</text>
<text x="292" y="447" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#444">on our server</text>
<line x1="292" y1="486" x2="110" y2="486" stroke="#2e8b45" stroke-width="1.5" marker-end="url(#a3)"/>
<text x="201" y="478" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#2e8b45">200 OK + PDF</text>
<text x="201" y="502" text-anchor="middle" font-size="10" font-weight="normal" fill="#555">header X-Converted-By</text>
<rect x="40" y="520" width="140" height="32" rx="6" fill="#eef2f7" stroke="#5b6b82"/><text x="110" y="540" text-anchor="middle" font-size="11" font-weight="normal" fill="#444">shows the PDF</text>
<text x="60" y="620" text-anchor="start" font-size="15" font-weight="bold" fill="#1a1a1a">Reading the diagram</text>
<line x1="60" y1="628" x2="734" y2="628" stroke="#ccc"/>
<text x="60" y="648" text-anchor="start" font-size="12" font-weight="normal" fill="#444">Solid arrow = a request.  Dashed arrow = an answer.  Green box = the conversion.</text>
<text x="60" y="670" text-anchor="start" font-size="12" font-weight="normal" fill="#444">If it fails, the app gets a JSON error: 422 (broken file), 429 (too many requests), 503 (server busy), 504 (too slow).</text>
<text x="60" y="692" text-anchor="start" font-size="12" font-weight="normal" fill="#444">Files never leave our server. No third-party service is used.</text>
<text x="60" y="714" text-anchor="start" font-size="12" font-weight="normal" fill="#444">On 503 the app waits Retry-After seconds and tries again (2 times). A PDF file is never sent: the app uses it as is.</text>
</svg>
